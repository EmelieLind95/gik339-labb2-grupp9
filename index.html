<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title id="titel">Labb 2 - grupp 9</title>

    <style>
      /*
            css som påverkar de olika id, classer. 
            # är för id
            . class. 
            Har tagit information från W3schools för att veta komma ihåg hur man ska styla allt. 
            Har ställt ledande frågor till claude om, är det inte flex man ska använda här, men fått svar, att det är väl bättre med grid.
            
        */
      body {
        background-color: rgb(252, 224, 140);
        font-size: large;
        font-weight: 800;
        color: rgb(167, 41, 56);
      }

      #heading1 {
        text-align: center;
        margin-top: 150px;
      }
      .container {
        display: grid;
        grid-template-columns: 200px 1fr; /* kolumn 1: labels, kolumn 2: inputs */
        gap: 10px;
        background-color: rgb(167, 41, 56);
        color: rgb(252, 224, 140);
        width: 500px;
        padding: 50px;
        margin: auto;
        border-radius: 10px;
      }

      .textfield {
        border: 1px solid black;
        background-color: rgb(255, 241, 141);
      }

      #divStyle {
        justify-self: start;
      }

      #emptyDiv {
        grid-column: 1 / -1;
        border: 1px solid black;
        padding: 10px;
        background-color: rgb(252, 224, 140);
        color: rgb(167, 41, 56);
        margin-top: 10px;
      }

      #regretButton {
        background-color: rgb(252, 224, 140);
        color: rgb(167, 41, 56);
        font-size: large;
        border: none;
        border-radius: 50px;
        padding: 5px;
        width: 100px;
        text-align: center;
        display: inline-block;
        cursor: pointer;
      }
      #regretButton:hover {
        background-color: #4caf50; /* Green */
        color: white;
      }
    </style>
  </head>
  <body>
   
    <h1 id="heading1">Labb 2 - grupp 9</h1>
    
    <!-- Skapat en div class med namnet container, för att  "gruppera" det som skedde i input delen. 
           Sedan har jag lagt in id, namn class enligt uppgiften. -->
    <div class="container">
      <label for="color">Färg</label>
      <input type="text" id="color" name="color" class="textfield" />

      <label for="content">Innehåll</label>
      <input type="text" id="content" name="content" class="textfield" />

      <label for="divStyle">Stil på box</label>
      <input type="checkbox" id="divStyle" name="divStyle" class="checkbox" />
      <button id="regretButton">Ta bort</button>
      <div id="emptyDiv"></div>

     
    </div>

    <script src="script.js"></script>
  </body>
</html>
